<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Clipper — podcast to Reels automation</title>
  <desc id="desc">A clean product overview showing how Clipper discovers podcast moments, ranks them with Gemini, renders vertical clips, checks quality and publishes to Instagram.</desc>
  <rect width="1440" height="980" fill="#ffffff"/>
  <circle cx="1260" cy="165" r="210" fill="#f6f6f6"/>
  <circle cx="1260" cy="165" r="145" fill="none" stroke="#e9e9e9" stroke-width="2"/>
  <rect x="92" y="72" width="38" height="38" rx="11" fill="#111111"/>
