    <circle cx="42" cy="41" r="20" fill="#111111"/><text x="42" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">1</text>
    <text x="82" y="35" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#111111">Discover &amp; understand</text>
    <text x="82" y="61" font-family="Inter,Arial,sans-serif" font-size="17" fill="#555555">Episode transcripts, speech signals and heatmaps</text>
    <rect y="96" width="600" height="82" rx="15" fill="#f7f7f7"/>
    <circle cx="42" cy="137" r="20" fill="#111111"/><text x="42" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">2</text>
    <text x="82" y="131" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#111111">Select strong moments</text>
    <text x="82" y="157" font-family="Inter,Arial,sans-serif" font-size="17" fill="#555555">Gemini ranks hooks, clarity and payoff</text>
    <rect y="192" width="600" height="82" rx="15" fill="#f7f7f7"/>
    <circle cx="42" cy="233" r="20" fill="#111111"/><text x="42" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">3</text>
    <text x="82" y="227" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#111111">Edit &amp; quality-check</text>
    <text x="82" y="253" font-family="Inter,Arial,sans-serif" font-size="17" fill="#555555">9:16 video, captions, FFmpeg and AI review</text>
    <rect y="288" width="600" height="82" rx="15" fill="#111111"/>
    <circle cx="42" cy="329" r="20" fill="#ffffff"/><text x="42" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#111111">4</text>
