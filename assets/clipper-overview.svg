  <path d="M124 84 L138 76 L138 106 L124 98 Z" fill="#111111"/>
  <text x="154" y="101" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#111111">Clipper</text>
  <text x="1348" y="99" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="16" letter-spacing="3" fill="#666666">OPEN SOURCE · BUILT INDEPENDENTLY</text>
  <path d="M92 145 H1348" stroke="#dddddd" stroke-width="2"/>
  <text x="92" y="265" font-family="Inter,Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-5" fill="#101010">Podcast in.</text>
  <text x="92" y="370" font-family="Inter,Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-5" fill="#101010">Reels out.</text>
  <text x="98" y="432" font-family="Inter,Arial,sans-serif" font-size="27" fill="#444444">An AI-assisted pipeline for finding, editing and publishing</text>
  <text x="98" y="470" font-family="Inter,Arial,sans-serif" font-size="27" fill="#444444">short-form moments from authorised podcast episodes.</text>
  <g transform="translate(98 548)">
