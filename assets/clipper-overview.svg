    <text x="281" y="193" font-family="Inter,Arial,sans-serif" font-size="18" fill="#555555">Highlighted spoken words</text>
    <text x="281" y="223" font-family="Inter,Arial,sans-serif" font-size="18" fill="#555555">Technical QA</text>
