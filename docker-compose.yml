services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=500"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: clipper
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipper-local-dev}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d clipper"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-clipper-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-clipper-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio: {condition: service_started}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-clipper-local} ${S3_SECRET_ACCESS_KEY:-clipper-local-secret}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-clipper-media}

  planner:
    build: .
    command: python -m scheduler.planner
    restart: unless-stopped
    environment: &clipper_env
      DATABASE_URL: postgresql://clipper:${POSTGRES_PASSWORD:-clipper-local-dev}@postgres:5432/clipper
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clipper-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clipper-local-secret}
      S3_BUCKET: ${S3_BUCKET:-clipper-media}
      S3_REGION: us-east-1
      CLIPPER_STATE_BACKEND: postgres
      CLIPPER_USER_ID: ${CLIPPER_USER_ID}
      IG_GRAPH_VERSION: ${IG_GRAPH_VERSION:-v25.0}
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      YOUTUBE_ENABLED: ${YOUTUBE_ENABLED:-true}
      PUBLISH_CONCURRENCY: ${PUBLISH_CONCURRENCY:-150}
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    build: .
    command: python -m scheduler.worker
    restart: unless-stopped
    environment:
      <<: *clipper_env
      CLIPPER_JOB_HANDLER_MODULE: scheduler.clipper_handlers
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    deploy:
      replicas: 2

  dispatcher:
    build: .
    command: python -m scheduler.dispatcher
    restart: unless-stopped
    environment: *clipper_env
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      replicas: 2

volumes:
  postgres_data:
  minio_data:
