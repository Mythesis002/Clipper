name: podcast-clipper

on:
  schedule:
    # GitHub cron is UTC and often starts 5-30 min late. We start ~10 min before the slot
    # and the script waits for the exact time (or posts immediately if already late).
    - cron: "20 0 * * *"     # 05:50 IST -> posts at 06:00 IST
    - cron: "20 12 * * *"    # 17:50 IST -> posts at 18:00 IST
    # Backup runs: if a primary run was dropped/late/failed, these post the missed slot (catch-up).
    # When nothing is due they finish in ~2 minutes.
    - cron: "20 2 * * *"     # 07:50 IST
    - cron: "20 14 * * *"    # 19:50 IST
  workflow_dispatch:
    inputs:
      command:
        description: "check-live never publishes. Choose publish-now to attempt one real Reel immediately."
        type: choice
        default: check-live
        options: [check-live, check, produce, publish-now, tick, publish, metrics, status, approve, reject, confirm-post, retry-uncertain]
      dry_run:
        description: "produce: analyse only, queue nothing"
        type: boolean
        default: false
      force:
        description: "tick/publish/approve only; check-live never publishes"
        type: boolean
        default: false
      clip_id:
        description: "Clip ID for approve/reject manual review commands"
        type: number
        required: false
      media_id:
        description: "Instagram media ID when confirming an uncertain publish"
        type: string
        required: false

concurrency:
  group: clipper             # never two runs at once (they share state/state.json)
  cancel-in-progress: false

permissions:
  contents: write            # to commit state/state.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # yt-dlp requires an external JS runtime for current YouTube challenge solving.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Python packages (yt-dlp + EJS + matching PO-token plugin)
        run: |
          python -m pip install --upgrade -r requirements.txt
          python - <<'PY'
          from importlib.metadata import version
          import yt_dlp
          print(f"yt-dlp: {yt_dlp.version.__version__}")
          print(f"yt-dlp-ejs: {version('yt-dlp-ejs')}")
          print(f"bgutil-ytdlp-pot-provider: {version('bgutil-ytdlp-pot-provider')}")
          PY
          deno --version

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Optional pyannote speaker diarization dependency
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          with Path("config.yaml").open(encoding="utf-8") as stream:
              config = yaml.safe_load(stream) or {}
          enabled = bool((config.get("diarization") or {}).get("enabled", False))
          token = os.environ.get("HF_TOKEN", "").strip()

          if not enabled:
              print("Speaker diarization is disabled in config.yaml.")
          elif not token:
              print("::warning::Diarization is enabled, but HF_TOKEN is missing; inference will be skipped.")
          else:
              subprocess.check_call([
                  "python", "-m", "pip", "install", "-r", "requirements-diarization.txt"
              ])
          PY

      - name: Start matching PO-token provider for yt-dlp
        run: |
          # Bind only to loopback: this unauthenticated local helper must not be exposed publicly.
          docker run -d --name pot --init -p 127.0.0.1:4416:4416 brainicism/bgutil-ytdlp-pot-provider:2.0.2
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO-token provider is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::PO-token provider did not become ready on 127.0.0.1:4416."
          docker logs pot || true
          exit 1

      - name: YouTube cookies (optional secret YT_COOKIES)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Run
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_PROXY: ${{ secrets.YT_PROXY }}
          CMD: ${{ inputs.command || 'tick' }}      # scheduled runs have no input -> tick
          DRY: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          CLIP_ID: ${{ inputs.clip_id }}
          MEDIA_ID: ${{ inputs.media_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # A force flag cannot turn a diagnostic check into a production publish.
          if [ "$CMD" = "check-live" ] && [ "$FORCE" = "true" ]; then
            echo "::error::check-live is diagnostic only and never publishes. Select publish-now, or choose tick and enable force."
            exit 2
          fi
          ARGS=""
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          if [ "$CMD" = "check-live" ]; then CMD=check; ARGS="$ARGS --live"; fi
          if [ "$CMD" = "approve" ] || [ "$CMD" = "reject" ] || [ "$CMD" = "retry-uncertain" ]; then
            if [ -z "$CLIP_ID" ]; then echo "::error::clip_id is required for this command"; exit 2; fi
            ARGS="$ARGS --clip-id $CLIP_ID"
          fi
          if [ "$CMD" = "confirm-post" ]; then
            if [ -z "$CLIP_ID" ] || [ -z "$MEDIA_ID" ]; then echo "::error::clip_id and media_id are required"; exit 2; fi
            ARGS="$ARGS --clip-id $CLIP_ID --media-id $MEDIA_ID"
          fi
          python podcast_clipper.py "$CMD" $ARGS

      - name: Upload clips awaiting manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clip-review-${{ github.run_id }}
          path: review/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Save state (queue + results)
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          # The state directory may not exist on a fresh checkout or on an idle run.
          mkdir -p state
          touch state/.gitkeep
          git add -A -- state/
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q
            git push
          fi
